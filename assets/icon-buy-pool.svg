<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="cartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
    <filter id="cartShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="buyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="cartMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="tokenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="buyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with dark emerald/teal gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#buyBg)" filter="url(#cartGlow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#buyBorder)" stroke-width="2.5" opacity="0.85"/>

  <!-- 3D Shopping Cart Loaded with Gold GIGA Tokens -->
  <g transform="translate(6, 6)" filter="url(#cartShadow)">
    <!-- Glowing GIGA Coins inside Basket -->
    <ellipse cx="62" cy="46" rx="14" ry="7" fill="url(#tokenGold)"/>
    <ellipse cx="62" cy="45" rx="12" ry="5.5" fill="#FEF08A"/>

    <ellipse cx="48" cy="49" rx="13" ry="6.5" fill="url(#tokenGold)"/>
    <ellipse cx="48" cy="48" rx="11" ry="5" fill="#FEF08A"/>

    <!-- Shopping Cart Frame -->
    <!-- Handle & Rear Bar -->
    <path d="M22 36 L32 36 L44 68 L84 68 L94 44 L38 44" fill="none" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cart Basket Grid Lines -->
    <path d="M41 52 L90 52 M45 60 L86 60" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 44 L54 68 M66 44 L66 68 M78 44 L76 68" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>

    <!-- Wheels (3D) -->
    <g transform="translate(48, 80)">
      <circle cx="0" cy="0" r="7" fill="#064E3B"/>
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>
    <g transform="translate(80, 80)">
      <circle cx="0" cy="0" r="7" fill="#064E3B"/>
      <circle cx="0" cy="0" r="6" fill="#10B981"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    </g>

    <!-- Plus / Buy Pill Badge in Top Right -->
    <g transform="translate(74, 18)">
      <circle cx="16" cy="16" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M16 10 L16 22 M10 16 L22 16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Sparkle Stars -->
    <polygon points="32,24 33.5,28 37,29 33.5,30 32,34 30.5,30 27,29 30.5,28" fill="#FDE047"/>
  </g>
</svg>
