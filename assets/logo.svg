<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="25%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#0070F3" />
      <stop offset="75%" stop-color="#00DFD8" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon / Cube Node Icon -->
  <g transform="translate(5, 5)">
    <!-- Multi-color outer border -->
    <polygon points="20,2 38,12 38,32 20,42 2,32 2,12" stroke="url(#rainbowGrad)" stroke-width="3" fill="none" filter="url(#glow)"/>
    <!-- Gold inner facets -->
    <polygon points="20,4 36,13 20,22 4,13" fill="url(#goldGrad)" opacity="0.9"/>
    <polygon points="20,22 36,13 36,31 20,39" fill="url(#goldGrad)" opacity="0.75"/>
    <polygon points="20,22 4,13 4,31 20,39" fill="url(#goldGrad)" opacity="0.6"/>
    <!-- Central Node Core -->
    <circle cx="20" cy="22" r="3.5" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- Logo Typography -->
  <text x="52" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="#0F172A">
    GIGA<tspan fill="url(#goldGrad)">CHAIN</tspan>
  </text>
  <circle cx="192" cy="18" r="3" fill="url(#rainbowGrad)"/>
</svg>

