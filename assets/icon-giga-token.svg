<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
    <filter id="coinDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="gigaRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="gigaFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="gigaEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with luxury dark gradient & rainbow rim -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0F172A" filter="url(#goldGlow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rainbowBorder)" stroke-width="2.5" opacity="0.85"/>

  <!-- 3D Gold Coin Base -->
  <g transform="translate(0, 0)">
    <!-- Outer 3D Coin Edge -->
    <circle cx="64" cy="65" r="46" fill="#78350F"/>
    <circle cx="64" cy="64" r="46" fill="url(#gigaRim)"/>
    <circle cx="64" cy="64" r="41" fill="#92400E"/>
    <circle cx="64" cy="63" r="40" fill="url(#gigaFace)" filter="url(#coinDepth)"/>

    <!-- Inner Ring Ribbed Details -->
    <circle cx="64" cy="63" r="35" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- Geometric GigaChain 3D 'G' Emblem -->
    <!-- Outer Hex G -->
    <path d="M64 35 L86 47 L86 73 L64 85 L42 73 L42 47 Z" fill="none" stroke="#78350F" stroke-width="4"/>
    <path d="M64 34 L85 46 L85 72 L64 84 L43 72 L43 46 Z" fill="none" stroke="url(#gigaEmblem)" stroke-width="3.5"/>

    <!-- 'G' Letter Core Bar -->
    <path d="M72 63 L85 63 L85 71 L64 83 L44 71 L44 47 L64 35 L84 46 L77 50 L64 43 L52 50 L52 68 L64 75 L77 68 L77 59 L64 59 L64 55 L72 55 Z" fill="url(#gigaEmblem)"/>

    <!-- Sparkle Highlights -->
    <polygon points="46,38 48,43 53,45 48,47 46,52 44,47 39,45 44,43" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="86,76 87,79 90,80 87,81 86,84 85,81 82,80 85,79" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
