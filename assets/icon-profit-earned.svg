<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="profitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
    <filter id="itemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="profitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <linearGradient id="bagGold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="growthArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <linearGradient id="profitBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with dark emerald/slate gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#profitBg)" filter="url(#profitGlow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#profitBorder)" stroke-width="2.5" opacity="0.85"/>

  <!-- 3D Money Bag / Vault Icon -->
  <g transform="translate(0, 0)">
    <!-- Shadow beneath bag -->
    <ellipse cx="64" cy="94" rx="34" ry="7" fill="#000000" opacity="0.35"/>

    <!-- Money Bag Body (3D Gold) -->
    <path d="M42 56 C38 68, 36 82, 44 91 C50 97, 78 97, 84 91 C92 82, 90 68, 86 56 C82 50, 78 48, 74 48 L54 48 C50 48, 46 50, 42 56 Z" fill="url(#bagGold)" filter="url(#itemShadow)"/>

    <!-- Bag Top Ruffle / Tied Neck -->
    <path d="M52 48 L46 36 L54 39 L64 34 L74 39 L82 36 L76 48 Z" fill="#F59E0B"/>
    <!-- Tied Cord -->
    <rect x="50" y="46" width="28" height="5" rx="2.5" fill="#78350F"/>
    <rect x="52" y="47" width="24" height="3" rx="1.5" fill="#FEF08A"/>

    <!-- Golden Coin on Bag Front -->
    <circle cx="64" cy="72" r="16" fill="#78350F"/>
    <circle cx="64" cy="71" r="15" fill="#FEF08A"/>
    <circle cx="64" cy="71" r="13" fill="#F59E0B"/>
    <!-- Dollar Symbol inside Coin -->
    <text x="64" y="77" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">$</text>

    <!-- Upward Profit Growth Arrow -->
    <g transform="translate(74, 28)">
      <circle cx="16" cy="16" r="15" fill="#065F46" opacity="0.9"/>
      <path d="M8 20 L16 11 L24 20 M16 12 L16 23" fill="none" stroke="url(#growthArrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sparkle Stars -->
    <polygon points="34,44 36,49 41,51 36,53 34,58 32,53 27,51 32,49" fill="#FDE047" opacity="0.95"/>
    <polygon points="94,76 95,79 98,80 95,81 94,84 93,81 90,80 93,79" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
