<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="usdtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#26A17B" flood-opacity="0.35"/>
    </filter>
    <filter id="usdtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Emerald Teal Gradients -->
    <linearGradient id="usdtRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="30%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="usdtFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="35%" stop-color="#26A17B"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <linearGradient id="tealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with dark slate background & teal glow -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0F172A" filter="url(#usdtGlow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#tealBorder)" stroke-width="2.5" opacity="0.85"/>

  <!-- 3D USDT Coin Base -->
  <g transform="translate(0, 0)">
    <!-- Outer 3D Coin Edge -->
    <circle cx="64" cy="65" r="46" fill="#064E3B"/>
    <circle cx="64" cy="64" r="46" fill="url(#usdtRim)"/>
    <circle cx="64" cy="64" r="41" fill="#065F46"/>
    <circle cx="64" cy="63" r="40" fill="url(#usdtFace)" filter="url(#usdtShadow)"/>

    <!-- Inner Circle Bevel -->
    <circle cx="64" cy="63" r="35" fill="none" stroke="#D1FAE5" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.55"/>

    <!-- Official Tether ₮ Symbol in Ultra-Crisp White -->
    <!-- Top Horizontal Bar -->
    <rect x="38" y="43" width="52" height="7" rx="3.5" fill="#FFFFFF" filter="url(#usdtShadow)"/>

    <!-- Center Tether 'T' Shape -->
    <path d="M58 49 L70 49 L70 57 C78 57 85 58.5 85 61 C85 63.5 78 65 70 65 L70 85 L58 85 L58 65 C50 65 43 63.5 43 61 C43 58.5 50 57 58 57 Z" fill="#FFFFFF"/>

    <!-- Middle Cutout for Tether Ring -->
    <ellipse cx="64" cy="61" rx="15" ry="3.5" fill="#047857"/>
    <rect x="60" y="55" width="8" height="12" fill="#FFFFFF"/>

    <!-- Sparkle Highlights -->
    <polygon points="46,38 48,43 53,45 48,47 46,52 44,47 39,45 44,43" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="86,76 87,79 90,80 87,81 86,84 85,81 82,80 85,79" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
