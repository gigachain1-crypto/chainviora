<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sellGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
    <filter id="tagShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="sellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <linearGradient id="sellBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="speedArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container with dark luxury gradient -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sellBg)" filter="url(#sellGlow)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#sellBorder)" stroke-width="2.5" opacity="0.85"/>

  <!-- 3D Sell Tag with Fast Trading Motion -->
  <g transform="translate(6, 6)" filter="url(#tagShadow)">
    <!-- Tag Shadow -->
    <path d="M36 42 L64 26 L94 56 L66 84 L38 84 Z" fill="#000000" opacity="0.25" transform="translate(2, 4)"/>

    <!-- Angled 3D Sell Tag Body -->
    <path d="M38 42 L66 26 C68 25, 71 26, 73 28 L94 49 C96 51, 96 54, 94 56 L73 77 C71 79, 68 80, 66 80 L38 80 C35 80, 33 78, 33 75 L33 47 C33 44, 35 42, 38 42 Z" fill="url(#tagGradient)"/>

    <!-- Inner Metallic Highlight Border -->
    <path d="M41 45 L65 31 L89 55 L65 76 L41 76 Z" fill="none" stroke="#FEF08A" stroke-width="1.5" opacity="0.6"/>

    <!-- Tag String Hole -->
    <circle cx="45" cy="59" r="6" fill="#78350F"/>
    <circle cx="45" cy="59" r="4.5" fill="#0F172A"/>

    <!-- Fast-Trade Dual Arrows Symbol ⇄ inside Tag -->
    <g transform="translate(62, 53)">
      <!-- Top Right Arrow (Selling) -->
      <path d="M-5 -4 L9 -4 M5 -8 L9 -4 L5 0" fill="none" stroke="url(#speedArrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Bottom Left Arrow (Matching) -->
      <path d="M9 7 L-5 7 M-1 3 L-5 7 L-1 11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Speed / Fast Rocket Pill Badge in Top Right -->
    <g transform="translate(74, 18)">
      <circle cx="16" cy="16" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
      <text x="16" y="21" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">⚡</text>
    </g>

    <!-- Sparkle Stars -->
    <polygon points="26,30 27.5,34 31,35 27.5,36 26,40 24.5,36 21,35 24.5,34" fill="#FDE047"/>
    <polygon points="96,78 97,81 100,82 97,83 96,86 95,83 92,82 95,81" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
